function beep(type){if(!soundOn)return;try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const t=actx.currentTime,map={tap:[660,.05],nav:[520,.07],week:[392,.11],ok:[880,.13],err:[220,.12]},cfg=map[type]||map.tap,o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.setValueAtTime(cfg[0],t);o.frequency.exponentialRampToValueAtTime(cfg[0]*(type==='ok'?1.6:1.12),t+cfg[1]);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+cfg[1]);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+cfg[1]+.02)}catch(e){}}
function render(){const wi=weekIndex(sel),di=dayIdx(sel),inactive=isBeforeStart(sel);document.documentElement.style.setProperty('--day-color',DAY_COLORS[di]);document.getElementById('wkNum').textContent=wi+1;document.getElementById('heroDate').textContent=fmtLong(sel);document.getElementById('heroSub').textContent=inactive?'Menu non ancora attivo · inizia '+fmtStart():'Settimana '+(wi+1)+' di '+DATA.cycleWeeks+' · '+DAYS[di]+' · '+DATA.title;const tag=document.getElementById('todayTag');tag.innerHTML=sameDay(sel,TODAY)?'<span class="status '+(inactive?'inactive':'active')+'">'+(inactive?'⏳ In arrivo':'● Oggi')+'</span>':(inactive?'<span class="status inactive">Menu non attivo</span>':'');document.getElementById('seasonLabel').textContent='MENÙ '+DATA.season.toUpperCase();document.getElementById('audienceLabel').textContent=(DATA.audience||'').toUpperCase();document.getElementById('notesText').innerHTML=(DATA.notes||[]).join('<br>');document.getElementById('startText').textContent='Il menù invernale inizia '+fmtStart()+'.';
const pips=document.getElementById('pips');pips.innerHTML='';for(let w=0;w<DATA.cycleWeeks;w++){const p=document.createElement('button');p.type='button';p.className='pip'+(w===wi?' on':'');p.dataset.gleanId='pip-week-'+(w+1);p.setAttribute('aria-label','Vai alla settimana '+(w+1));p.onclick=()=>{beep('week');goWeek(w)};pips.appendChild(p)}
const chips=document.getElementById('dayChips');chips.innerHTML='';const mon=mondayOf(sel);for(let i=0;i<5;i++){const dd=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i),b=document.createElement('button');b.type='button';b.className='day-chip'+(i===di?' on':'');b.style.setProperty('--day-color',DAY_COLORS[i]);b.dataset.gleanId='chip-day-'+(i+1);b.innerHTML='<b>'+DAYS[i].slice(0,3).toUpperCase()+'</b><span>'+fmtShort(dd)+'</span>';b.onclick=()=>{beep('tap');sel=dd;render()};chips.appendChild(b)}
document.getElementById('cardDay').textContent=DAYS[di];document.getElementById('cardMeta').textContent='Settimana '+(wi+1)+' · '+fmtShort(sel);const box=document.getElementById('courses');box.innerHTML='';if(inactive){box.innerHTML='<div class="inactive-card"><div class="big">❄️</div><h3>Il menù invernale non è ancora attivo</h3><p>Questa settimana è precedente all’avvio del ciclo. Il primo giorno disponibile è <b>'+fmtStart()+'</b>.</p><button type="button" class="jump-btn" id="jumpStart">Vai al 2 novembre</button></div>';document.getElementById('jumpStart').onclick=()=>{beep('ok');sel=parseDate(DATA.startDate);render()};return}const m=DATA.menu[wi][di];FIELDS.forEach(f=>{let val=m[f.key];if(f.key==='secondo'&&!val)val='Piatto unico <em>(nessun secondo indicato)</em>';const el=document.createElement('div');el.className='course';el.dataset.gleanId='course-'+f.key;el.innerHTML='<div class="emo">'+f.emo+'</div><div><div class="k">'+f.label+'</div><div class="v">'+val+'</div></div>';box.appendChild(el)})}
function goWeek(target){if(isBeforeStart(sel)){sel=parseDate(DATA.startDate);if(target!==0)sel=new Date(sel.getFullYear(),sel.getMonth(),sel.getDate()+target*7);render();return}const cur=weekIndex(sel),delta=((target-cur)+DATA.cycleWeeks)%DATA.cycleWeeks;sel=new Date(sel.getFullYear(),sel.getMonth(),sel.getDate()+delta*7);render()}
function stepDay(n){let d=new Date(sel.getFullYear(),sel.getMonth(),sel.getDate()+n);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+(n>0?1:-1));sel=d;render()}
function norm(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function nextOccurrence(wi,di){let base=new Date(Math.max(TODAY.getTime(),parseDate(DATA.startDate).getTime()));for(let k=0;k<140;k++){const d=new Date(base.getFullYear(),base.getMonth(),base.getDate()+k);if(d.getDay()>=1&&d.getDay()<=5&&weekIndex(d)===wi&&dayIdx(d)===di)return d}return null}
function search(qRaw){const q=norm(qRaw).trim(),res=document.getElementById('results'),cnt=document.getElementById('count');res.innerHTML='';cnt.textContent='';if(q.length<2){res.innerHTML='<div class="empty">Digita almeno 2 lettere per cercare nelle 4 settimane.</div>';return}let hits=[];for(let w=0;w<DATA.cycleWeeks;w++)for(let d=0;d<5;d++){const m=DATA.menu[w][d],matched=[];FIELDS.forEach(f=>{if(m[f.key]&&norm(m[f.key]).includes(q))matched.push(f.label+': '+m[f.key])});if(matched.length)hits.push({w,d,txt:matched.join(' · ')})}if(!hits.length){beep('err');res.innerHTML='<div class="empty">Nessun piatto trovato per «'+qRaw+'». Prova: pizza, zucca, pasta, riso, merluzzo.</div>';return}hits.forEach(h=>{const nx=nextOccurrence(h.w,h.d),b=document.createElement('button');b.type='button';b.className='hit';b.style.setProperty('--hit-color',DAY_COLORS[h.d]);b.dataset.gleanId='hit-w'+(h.w+1)+'-d'+(h.d+1);b.innerHTML='<div class="wk"><small>SETT</small><b>'+(h.w+1)+'</b></div><div class="t"><b>'+DAYS[h.d]+' · Settimana '+(h.w+1)+'</b><span>'+h.txt+(nx?' &nbsp;|&nbsp; prossima volta: '+fmtShort(nx):'')+'</span></div>';b.onclick=()=>{beep('ok');sel=nx||parseDate(DATA.startDate);render();window.scrollTo({top:0,behavior:'smooth'})};res.appendChild(b)});cnt.textContent=hits.length+(hits.length===1?' giorno trovato':' giorni trovati')+' su 20 del ciclo.'}
function shareText(){const wi=weekIndex(sel),di=dayIdx(sel);if(isBeforeStart(sel))return'❄️ Menù mensa invernale Maslianico\nIl menù inizia '+fmtStart()+'.';const m=DATA.menu[wi][di],lines=['🍽️ Menù mensa Maslianico – '+DAYS[di]+' '+fmtShort(sel),'SETTIMANA '+(wi+1)+' di 4'];FIELDS.forEach(f=>{if(m[f.key])lines.push(f.label+': '+m[f.key])});if(!m.secondo)lines.push('Secondo: piatto unico');return lines.join('\n')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
async function doShare(){beep('ok');const txt=shareText();try{if(navigator.share){await navigator.share({title:'Menù mensa invernale',text:txt});return}}catch(e){return}try{await navigator.clipboard.writeText(txt);toast('Menù copiato: incollalo dove vuoi')}catch(e){toast('Copia manuale non disponibile')}}
document.getElementById('prevWeek').onclick=()=>{beep('week');sel=new Date(sel.getFullYear(),sel.getMonth(),sel.getDate()-7);render()};document.getElementById('nextWeek').onclick=()=>{beep('week');sel=new Date(sel.getFullYear(),sel.getMonth(),sel.getDate()+7);render()};document.getElementById('prevDay').onclick=()=>{beep('nav');stepDay(-1)};document.getElementById('nextDay').onclick=()=>{beep('nav');stepDay(1)};document.getElementById('btnToday').onclick=()=>{beep('ok');const t=new Date();sel=new Date(t.getFullYear(),t.getMonth(),t.getDate());render()};document.getElementById('btnShare').onclick=doShare;document.getElementById('btnSound').onclick=function(){soundOn=!soundOn;this.setAttribute('aria-pressed',soundOn?'true':'false');this.textContent=soundOn?'🔊':'🔇';if(soundOn)beep('ok')};const qEl=document.getElementById('q');qEl.addEventListener('input',()=>search(qEl.value));qEl.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();beep('tap');search(qEl.value)}});document.getElementById('btnClear').onclick=()=>{beep('nav');qEl.value='';search('');qEl.focus()};['pizza','zucca','pasta','riso','merluzzo','pollo','formaggio','frutta'].forEach(w=>{const b=document.createElement('button');b.type='button';b.textContent=w;b.dataset.gleanId='quick-'+w;b.onclick=()=>{beep('tap');qEl.value=w;search(w)};document.getElementById('quick').appendChild(b)});document.addEventListener('keydown',ev=>{if(document.activeElement===qEl)return;if(ev.key==='ArrowRight'){beep('nav');stepDay(1)}if(ev.key==='ArrowLeft'){beep('nav');stepDay(-1)}});let sx=0,sy=0;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dy)<50){beep('nav');stepDay(dx<0?1:-1)}},{passive:true});
async function loadData(){try{const r=await fetch('menu-data.json',{cache:'no-store'});if(!r.ok)throw new Error('data');const incoming=await r.json();if(incoming&&incoming.menu){DATA=incoming;document.getElementById('dataHint').textContent='Dati caricati da menu-data.json · PDF originale disponibile qui sopra.'}}catch(e){document.getElementById('dataHint').textContent='Dati incorporati di sicurezza · per GitHub Pages sostituisci menu-data.json quando cambia il menù.'}render();search('')}
loadData();
